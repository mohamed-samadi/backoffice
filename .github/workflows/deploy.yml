name: Build & Push Docker Hub

on:
  push:
    tags:
      - "v*" # Triggered on git tag v1.0.0, v1.1.0, etc.
  workflow_dispatch: # Allow manual trigger

env:
  REGISTRY: docker.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ─────────────────────────────────────────────────────────────────────
      # Checkout code
      # ─────────────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─────────────────────────────────────────────────────────────────────
      # Setup Docker Buildx (for multi-arch builds)
      # ─────────────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─────────────────────────────────────────────────────────────────────
      # Login to Docker Hub
      # ─────────────────────────────────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ─────────────────────────────────────────────────────────────────────
      # Extract version tag
      # ─────────────────────────────────────────────────────────────────────
      - name: Extract version tag
        id: tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      # ─────────────────────────────────────────────────────────────────────
      # Build & Push Backend Image
      # ─────────────────────────────────────────────────────────────────────
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/app-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/app-backend:${{ steps.tag.outputs.VERSION }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/app-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/app-backend:buildcache,mode=max

      # ─────────────────────────────────────────────────────────────────────
      # Build & Push Frontend Image
      # ─────────────────────────────────────────────────────────────────────
      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_STORAGE_URL=${{ secrets.VITE_STORAGE_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/app-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/app-frontend:${{ steps.tag.outputs.VERSION }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/app-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/app-frontend:buildcache,mode=max

      # ─────────────────────────────────────────────────────────────────────
      # Notify Success
      # ─────────────────────────────────────────────────────────────────────
      - name: Notify Success
        run: |
          echo "✅ Build succeeded!"
          echo "📦 Backend: ${{ secrets.DOCKERHUB_USERNAME }}/app-backend:${{ steps.tag.outputs.VERSION }}"
          echo "📦 Frontend: ${{ secrets.DOCKERHUB_USERNAME }}/app-frontend:${{ steps.tag.outputs.VERSION }}"

      # ─────────────────────────────────────────────────────────────────────
      # Create Release (optional)
      # ─────────────────────────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: actions/create-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.VERSION }}
          release_name: Release ${{ steps.tag.outputs.VERSION }}
          body: |
            ## Docker Images Published

            **Backend**
            ```bash
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/app-backend:${{ steps.tag.outputs.VERSION }}
            ```

            **Frontend**
            ```bash
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/app-frontend:${{ steps.tag.outputs.VERSION }}
            ```

            ### Deploy

            Update `.env` with `IMAGE_TAG=${{ steps.tag.outputs.VERSION }}` and run:
            ```bash
            docker compose -f docker-compose.prod.yml up -d --pull always
            ```
          draft: false
          prerelease: false
