version: "3.9"

services:
  # ── Base de données ──────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: app_db_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data_prod:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5
      interval: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Backend Laravel ──────────────────────────────────────────────────────
  backend:
    image: ${DOCKER_USERNAME:-redamohamedberhouma}/bizos-backend:${BACKEND_IMAGE_TAG:-latest}
    container_name: app_backend_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      FILESYSTEM_DISK: public
    volumes:
      - storage_data_prod:/var/www/html/storage/app/public
    ports:
      - "8000:80"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Frontend React ───────────────────────────────────────────────────────
  frontend:
    image: ${DOCKER_USERNAME:-redamohamedberhouma}/bizos-frontend:${FRONTEND_IMAGE_TAG:-latest}
    container_name: app_frontend_prod
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
      VITE_STORAGE_URL: ${VITE_STORAGE_URL:-http://localhost:8000/storage}
    ports:
      - "80:80"
    networks:
      - app_network
    healthcheck:
      test:
        ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data_prod:
    driver: local
  storage_data_prod:
    driver: local

networks:
  app_network:
    driver: bridge
