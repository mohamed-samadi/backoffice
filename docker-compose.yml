version: "3.8"

services:
  # Base de données MySQL
  db:
    image: mysql:8.0
    container_name: app_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: backoffice
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend Laravel API
  backend:
    build: ./backend
    container_name: app_backend
    restart: unless-stopped
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:igdZ3Shd80/RnkwpSKFvSCpUjdxLScfV5G2a8XlxCNY=
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: backoffice
      DB_USERNAME: user
      DB_PASSWORD: password
    volumes:
      - ./backend:/var/www/html

  # Frontend React + Vite
  frontend:
    build: ./frontend
    container_name: app_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      API_URL: http://backend:80
    volumes:
      - ./frontend:/app

volumes:
  db_data:
